<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script src="%sveltekit.assets%/theme-init.js"></script>
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		%sveltekit.head%
		<style>
			#pandora-preloader {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
				background: var(--c-bg);
				transition: opacity 0.3s ease;
			}
			#pandora-preloader.is-hiding {
				opacity: 0;
				pointer-events: none;
			}
			.preloader-inner {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 18px;
			}
			.preloader-logo {
				width: 56px;
				height: 56px;
				border-radius: 16px;
				background: linear-gradient(135deg, var(--c-login-accent-from), var(--c-login-accent-to));
				display: flex;
				align-items: center;
				justify-content: center;
				box-shadow: 0 12px 28px -8px rgba(var(--c-login-accent-to-rgb), 0.55);
			}
			.preloader-logo svg {
				width: 28px;
				height: 28px;
				stroke: #ffffff;
			}
			.preloader-name {
				font-family:
					'Space Grotesk',
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					system-ui,
					sans-serif;
				font-size: 17px;
				font-weight: 700;
				letter-spacing: -0.01em;
				color: var(--c-fg);
			}
			.preloader-spinner {
				width: 22px;
				height: 22px;
				border-radius: 50%;
				border: 2px solid rgba(var(--c-login-accent-to-rgb), 0.15);
				border-top-color: var(--c-login-accent-to);
				animation: preloader-spin 0.7s linear infinite;
			}
			@keyframes preloader-spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="pandora-preloader" aria-hidden="true">
			<div class="preloader-inner">
				<div class="preloader-logo">
					<svg
						viewBox="0 0 24 24"
						fill="none"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<rect x="2" y="4" width="20" height="16" rx="2" />
						<path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
					</svg>
				</div>
				<span class="preloader-name">Pandora</span>
				<div class="preloader-spinner"></div>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>

		<script src="%sveltekit.assets%/preloader.js"></script>
	</body>
</html>
